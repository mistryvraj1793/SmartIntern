spring.application.name=SmartIntern


#Server
server.port=9999

#DataBase
spring.datasource.url=jdbc:mysql://localhost:3306/Smartintern
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
#Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#views
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#Configures the SMTP server for sending emails using Gmail.
	# SMTP server details (Gmail example)
	# Use the generated password here
	spring.mail.host=smtp.gmail.com
	spring.mail.port=587
	spring.mail.username=YOUR_EMAIL
	spring.mail.password=YOUR_APP_PASSWORD
	# Enable authentication and TLS
	spring.mail.properties.mail.smtp.auth=true
	spring.mail.properties.mail.smtp.starttls.enable=true
